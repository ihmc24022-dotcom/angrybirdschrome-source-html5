<!DOCTYPE html>
<html>
  <head>
    <title>Angry Birds Mod - Lag Fix</title>
    <link rel="stylesheet" href="css/angry_birds_chrome.css" type="text/css">
    <script type="text/javascript">
      (function() {
        // 1. 拦截 GWT 内部最常用的字符串定义函数 ZDc
        // 这是 GWT 2.4.0（你的版本）生成字符串的入口
        var originalZDc = window.ZDc;
        Object.defineProperty(window, 'ZDc', {
          get: function() { return window._ZDc; },
          set: function(fn) {
            window._ZDc = function(val) {
              // 只要游戏尝试创建 "Poached Eggs" 字符串，立刻替换
              if (val === 'Poached Eggs') return "Building Mode";
              return fn(val);
            };
          },
          configurable: true
        });

        // 2. 针对 Episodes.json 的静态拦截
        var oldOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url) {
          if (url.indexOf("Episodes.json") > -1) {
            url = "data/Episodes.json?v=" + new Date().getTime(); 
          }
          oldOpen.apply(this, arguments);
        };

        // 3. 极轻量级的补丁（只运行一次，不循环扫描）
        window.addEventListener('load', function() {
          setTimeout(function() {
            var root = window.$wnd || window;
            if (root.episodes && root.episodes[0]) {
               if(root.episodes[0].k) root.episodes[0].k = "Building Mode";
            }
          }, 3000); // 游戏加载3秒后执行一次即可
        });
      })();
    </script>
    <script type="text/javascript" src="fowl/fowl.nocache.js"></script>
  </head>
  <body>
    <div style="position:fixed;top:0;width:100%;background:lightblue;color:black;text-align:center;z-index:9999;font-size:12px;">
      V9.0 LAG FIX ACTIVE
    </div>
    <div id='gameDiv'><div id='playn-root'></div></div>
  </body>
</html>
