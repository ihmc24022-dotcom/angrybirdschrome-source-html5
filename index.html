<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Angry Birds - Fix V3</title>
    <link rel="stylesheet" href="cors/fowl/css/angry_birds_chrome.css">
    <script>
        (function() {
            var statusBox = null;
            function logStatus(msg, color) {
                if(!statusBox) {
                    statusBox = document.createElement('div');
                    statusBox.style = "position:fixed;top:0;left:0;width:100%;z-index:9999;font-size:12px;padding:5px;text-align:center;font-weight:bold;color:white;font-family:sans-serif;background:rgba(0,0,0,0.8);";
                    document.body.appendChild(statusBox);
                }
                statusBox.innerText = msg;
                statusBox.style.color = color || "white";
            }

            // 核心修复：强制劫持所有文件请求
            var oldOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url) {
                var newUrl = url;
                var lowUrl = url.toLowerCase();
                
                // 所有的请求都强制加上 cors/fowl/ 前缀
                if (lowUrl.indexOf("cors/fowl/") === -1) {
                    // 如果请求里已经包含了 data/ 或 images/，就补全路径
                    if (lowUrl.indexOf("data/") === 0 || lowUrl.indexOf("images/") === 0 || lowUrl.indexOf("audio/") === 0) {
                        newUrl = "cors/fowl/" + url;
                    }
                }

                // 特殊处理 build-1.json (有些版本路径带 levels)
                if (lowUrl.indexOf("build-1") > -1) {
                    newUrl = "cors/fowl/data/build-1.json";
                    logStatus("⚙️ 物理引擎就绪", "#2ecc71");
                }

                console.log("Redirect:", url, "->", newUrl);
                oldOpen.apply(this, [method, newUrl, arguments[2]]);
            };

            // 劫持图片加载
            var nativeImage = window.Image;
            window.Image = function() {
                var img = new nativeImage();
                var setter = img.__lookupSetter__("src");
                Object.defineProperty(img, "src", {
                    set: function(s) {
                        var res = s;
                        if (s.indexOf("cors/fowl/") === -1 && s.indexOf("http") === -1) {
                            res = "cors/fowl/" + s;
                        }
                        this.setAttribute("src", res);
                    }
                });
                return img;
            };

            setInterval(function() {
                var g = window.$wnd || window;
                if (g.episodes && g.episodes[0]) {
                    g.episodes[0].k = 'Building Mode';
                    g.episodes[0].pageIndexes = ['build'];
                }
            }, 100);
        })();
    </script>
    <script src="cors/fowl/fowl.nocache.js"></script>
</head>
<body style="background: #000; margin: 0;">
    <div id='gameDiv'><div id='playn-root'></div></div>
</body>
</html>
