<!DOCTYPE html>
<html>
<head>
    <title>Angry Birds Mod - V20</title>
    <link rel="stylesheet" href="css/angry_birds_chrome.css">
    <script>
        (function() {
            var oldOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url) {
                var lowUrl = url.toLowerCase();
                // 拦截 episodes.json
                if (lowUrl.indexOf("episode") > -1) {
                    url = "data/episodes.json?v=" + Date.now();
                }
                // 拦截关卡加载请求，确保它指向 data/levels/
                if (lowUrl.indexOf("build-1") > -1) {
                    url = "data/levels/build-1.json?v=" + Date.now();
                }
                oldOpen.apply(this, arguments);
            };

            // 内存强制覆盖逻辑保持不变
            setInterval(function() {
                var g = window.$wnd || window;
                if (g.episodes && g.episodes[0]) {
                    g.episodes[0].k = 'Building Mode';
                    g.episodes[0].pageIndexes = ['build'];
                }
            }, 500);
        })();
    </script>
    <script src="fowl/fowl.nocache.js"></script>
</head>
<body>
    <div style="position:fixed;top:0;width:100%;background:red;color:white;text-align:center;z-index:9999;font-size:12px;font-weight:bold;">
        V20 - LEVEL LOADING FIX
    </div>
    <div id='gameDiv'><div id='playn-root'></div></div>
</body>
</html>
