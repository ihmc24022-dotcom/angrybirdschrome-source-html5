<!DOCTYPE html>
<html>
  <head>
    <title>Angry Birds Mod - V10</title>
    <link rel="stylesheet" href="css/angry_birds_chrome.css" type="text/css">
    <script type="text/javascript">
      (function() {
        // 1. 核心逻辑：给 Object 原型链加一个“陷阱”
        // 这样无论哪个变量名叫 e，只要它尝试设置 .k 属性，就会被我们拦截
        var targetValue = "Poached Eggs";
        var newValue = "Building Mode";

        Object.defineProperty(Object.prototype, 'k', {
          get: function() { return this._k; },
          set: function(val) {
            if (val === targetValue) {
              console.log("拦截到 .k 赋值: Poached Eggs -> Building Mode");
              this._k = newValue;
            } else {
              this._k = val;
            }
          },
          configurable: true
        });

        // 2. 针对 pageIndexes 的相同拦截 (防止加载旧关卡)
        Object.defineProperty(Object.prototype, 'pageIndexes', {
          get: function() { return this._pi; },
          set: function(val) {
            if (Array.isArray(val) && val[0] === "poached_eggs") {
              this._pi = ["build"];
            } else {
              this._pi = val;
            }
          },
          configurable: true
        });

        // 3. 传统的 Episodes.json 拦截
        var oldOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url) {
          if (url.indexOf("Episodes.json") > -1) {
            url = "data/Episodes.json?v=" + new Date().getTime(); 
          }
          oldOpen.apply(this, arguments);
        };
      })();
    </script>
    <script type="text/javascript" src="fowl/fowl.nocache.js"></script>
  </head>
  <body>
    <div style="position:fixed;top:0;width:100%;background:orange;color:white;text-align:center;z-index:9999;font-size:12px;font-weight:bold;">
      V10.0 PROTOTYPE TRAP ACTIVE
    </div>
    <div id='gameDiv'><div id='playn-root'></div></div>
  </body>
</html>
