    <script type="text/javascript">
      (function() {
        // 1. 拦截文件请求
        var oldOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url) {
          if (url.indexOf("Episodes.json") > -1) {
            console.log("拦截成功：重定向关卡数据...");
            url = "data/Episodes.json?v=" + new Date().getTime(); 
          }
          oldOpen.apply(this, arguments);
        };

        // 2. 强制内存注入（双重保险）
        window.addEventListener('load', function() {
          var checkData = setInterval(function() {
            if (window.episodes || (window.game && window.game.episodes)) {
              var myData = [{
                "name": "Building Mode",
                "classicEpisode": true,
                "levelsPerPage": [1],
                "rowsPerPage": [1],
                "pageIndexes": ["build"],
                "menuImage": "EPISODE_POACHEDEGGS",
                "levelRequirements": [["build-1", "none", ""]]
              }];
              // 强行覆盖游戏内存变量
              if (window.episodes) window.episodes = myData;
              if (window.game && window.game.episodes) window.game.episodes = myData;
              console.log("内存数据已注入！");
              clearInterval(checkData);
            }
          }, 100);
        });
      })();
    </script>

    <script type="text/javascript" src="fowl/fowl.nocache.js"></script>

    <script type="text/javascript">
        function getFlashVersion() {
            try {
                var version;
                try {
                    version = new ActiveXObject("ShockwaveFlash.ShockwaveFlash").GetVariable("$version");
                } catch (e) {
                    version = navigator.plugins["Shockwave Flash"].description;
                }
                return version.replace(/\D*(\d+).*/g, "$1");
            } catch (e) { return -1; }
        }
        function haveAudioSupport() {
            try { if (new AudioContext() || new webkitAudioContext()) return true; } catch (ignore) { }
            return getFlashVersion() >= 9.0;
        }
    </script>
