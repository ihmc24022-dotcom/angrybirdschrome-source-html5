<!DOCTYPE html>
<html>
  <head>
    <title>Angry Birds Mod</title>
    <link rel="stylesheet" href="css/angry_birds_chrome.css" type="text/css">
    <script type="text/javascript">
      (function() {
        // 1. 深度拦截 JSON 解析（这是最有效的方法）
        var oldJSONParse = JSON.parse;
        JSON.parse = function(text) {
          // 如果解析的内容里包含 Poached Eggs，说明抓到了关卡数据
          if (text && text.indexOf("Poached Eggs") > -1) {
            console.log("抓到关卡数据包，正在强制重写...");
            // 构造我们的新关卡数据
            var myMod = [{
              "name": "Building Mode",
              "classicEpisode": true,
              "levelsPerPage": [1],
              "rowsPerPage": [1],
              "pageIndexes": ["build"],
              "menuImage": "EPISODE_POACHEDEGGS",
              "levelRequirements": [["build-1", "none", ""]]
            }];
            return myMod; // 强行返回修改后的数据
          }
          return oldJSONParse.apply(this, arguments);
        };

        // 2. 网络拦截双保险
        var oldOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url) {
          if (url.indexOf("Episodes.json") > -1) {
            url = "data/Episodes.json?v=" + new Date().getTime(); 
          }
          oldOpen.apply(this, arguments);
        };
      })();
    </script>
    <script type="text/javascript" src="fowl/fowl.nocache.js"></script>
  </head>
  <body>
    <div style="position:fixed;top:0;width:100%;background:lime;color:black;text-align:center;z-index:9999;font-size:12px;font-weight:bold;">
      V6.0 DATA INTERCEPTOR ACTIVE
    </div>
    <div id='gameDiv'><div id='playn-root'></div></div>
  </body>
</html>
